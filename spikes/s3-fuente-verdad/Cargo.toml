[package]
name = "demi-spike-s3"
description = "Spike S3 de Demi: fuente de verdad del documento (lopdf vs PDFium). Código desechable."
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "s3-bench"
path = "src/main.rs"

[dependencies]
demi-engine = { path = "../../crates/demi-engine" }
lopdf = "0.47"

# Workspace propio: los spikes no forman parte del workspace principal.
[workspace]
