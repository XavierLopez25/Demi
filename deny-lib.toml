# cargo-deny para los crates de biblioteca MIT OR Apache-2.0.
# Igual que deny.toml pero SIN licencias GPL: una biblioteca no puede depender de código GPL.
# Uso: cargo deny --config deny-lib.toml --manifest-path crates/<crate>/Cargo.toml check licenses

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "OFL-1.1",
]

[licenses.private]
ignore = false
