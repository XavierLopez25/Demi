version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Sus "versiones" son versiones de Rust (stable, 1.85…), no de la acción.
      - dependency-name: dtolnay/rust-toolchain
