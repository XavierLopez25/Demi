# Trabajos nocturnos de Demi (T0.2). Se irán llenando con:
# fuzzing (T2.2, T2.4), corpus completo (T0.4/T0.5) y rendimiento (T5.3).
name: Nocturno

on:
  schedule:
    - cron: "17 7 * * *" # 01:17 en Guatemala (UTC-6)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: Avisos de seguridad de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
