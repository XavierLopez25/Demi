# Corpus de PDFs de prueba de Demi (T0.4). Requisitos: R-NFR-CAL-05, requirements.md §14.
#
# Los PDFs NO se versionan. `cargo xtask corpus fetch [--set smoke|full]` los descarga
# verificando SHA-256 y genera los sintéticos. `cargo xtask corpus list` los muestra.
#
# expect: resultado esperado al abrir el documento con el motor
#   ok        abre y renderiza la primera página
#   password  requiere contraseña
#   error     falla de forma controlada (sin cierre inesperado)

[sources.pdfjs]
url_template = "https://raw.githubusercontent.com/mozilla/pdf.js/{commit}/test/pdfs/{path}"
commit = "bb1539a2c9b5b76d070284cca9091717133d8bf1"
license = "Apache-2.0 (suite de pruebas de mozilla/pdf.js; procedencia de cada archivo en ese repositorio)"

